services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      DATABASE_URL: postgresql+psycopg2://atlas:atlas@db:5432/atlas
    ports: ["8000:8000"]
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
    ports: ["5173:5173"]
    depends_on: [backend]
